name: Mellon submission moderation
description: Apply a repository human-voice contribution policy to opening issues and pull requests.
author: Mellon
branding:
  icon: message-square
  color: yellow
inputs:
  token:
    description: Token with the required issues and pull request permissions for API operations.
    required: false
  allowlist:
    description: JSON array of exact account logins to exempt.
    required: false
  response:
    description: Literal moderation response text. Empty means use the packaged default.
    required: false
  mode:
    description: Enforcement behavior. Use observe to apply a review label without commenting or closing. Defaults to enforce.
    required: false
    default: enforce
  auto-close:
    description: 'Close flagged issues and pull requests after posting a response. Set to "false" to post a response without closing. Defaults to "true".'
    required: false
    default: 'true'
  review-label:
    description: 'Shared across modes. Apply the mellon: review label to flagged submissions. Set to "false" to disable automatic labeling. Defaults to "true".'
    required: false
    default: 'true'
outputs:
  outcome:
    description: Safe moderation outcome enum.
  robot-score:
    description: Finite robot score when classification produced one.
runs:
  using: node24
  main: dist/index.mjs
