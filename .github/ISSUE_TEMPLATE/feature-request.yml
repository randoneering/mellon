name: Feature request
description: Suggest an improvement to mellon.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the change you would like to see.
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Expected result / Definition of done
      description: Describe specific, verifiable outcomes. Maintainers may refine the checklist and add tests and documentation requirements during triage.
      placeholder: |
        - [ ] The user can ...
        - [ ] The system behaves ... when ...
        - [ ] Existing behavior remains ...
    validations:
      required: true
