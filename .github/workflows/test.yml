name: Node build and tests
on:
  push:
  pull_request:
permissions:
  contents: read
  issues: none
  pull-requests: none
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without scripts
        run: npm ci --ignore-scripts
      - name: Install locked detector dependencies without scripts
        run: npm ci --prefix detector --ignore-scripts
      - name: Verify assets
        run: npm run verify:assets
      - name: Test build safety
        run: npm run test:build
      - name: Run JavaScript tests
        run: npm test
      - name: Verify parity
        run: npm run test:parity
      - name: Build release files
        run: npm run build
      - name: Check distribution is committed
        run: test -z "$(git status --porcelain --untracked-files=all -- dist)"
      - name: Validate workflow and bundle metadata
        run: npm run validate:release
